<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FaceContext — Contatos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh}

/* TOP BAR */
.topbar{position:sticky;top:0;z-index:100;background:#0a0e1a;border-bottom:1px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:18px;font-weight:700;color:#00ff88;flex:1}
.topbar .badge{background:rgba(0,255,136,0.12);color:#00ff88;border:1px solid rgba(0,255,136,0.3);border-radius:20px;padding:2px 10px;font-size:12px}
.btn-fab{width:44px;height:44px;border-radius:50%;background:#00ff88;color:#0a0e1a;border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;-webkit-tap-highlight-color:transparent}

/* SEARCH */
.search-wrap{padding:12px 16px 8px}
.search-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px 14px 10px 38px;color:#e2e8f0;font-size:15px;outline:none}
.search-input:focus{border-color:#00ff88}
.search-wrap{position:relative}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);opacity:0.4;pointer-events:none}

/* STATUS TABS */
.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab.active{background:#00ff88;color:#0a0e1a;border-color:#00ff88;font-weight:600}

/* CONTACT LIST */
.list{padding:0 16px 100px}
.contact-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .2s}
.contact-card:active{background:rgba(255,255,255,0.08)}
.contact-card.has-photo .avatar{background-size:cover;background-position:center}
.avatar{width:48px;height:48px;border-radius:50%;background:rgba(0,255,136,0.15);border:2px solid rgba(0,255,136,0.3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#00ff88}
.contact-info{flex:1;min-width:0}
.contact-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.25);color:#00ff88;padding:2px 7px;border-radius:10px;font-size:10px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.Identificado{background:#00ff88}
.status-dot.Pendente{background:#f59e0b}
.status-dot.Arquivado{background:#64748b}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3)}
.empty .icon{font-size:48px;margin-bottom:12px}

/* MODAL OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:#141824;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:0 0 40px;transform:translateY(100%);transition:transform .3s ease}
.overlay.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:12px auto 0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px}
.modal-title{font-size:17px;font-weight:700}
.btn-close{background:rgba(255,255,255,0.08);border:none;color:#e2e8f0;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

/* FORM */
.form-body{padding:0 20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px 14px;color:#e2e8f0;font-size:15px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#00ff88;box-shadow:0 0 0 2px rgba(0,255,136,0.15)}
.field textarea{resize:none;min-height:72px}
.field select option{background:#141824}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* PHOTO FIELD */
.photo-field{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.photo-preview{width:64px;height:64px;border-radius:50%;background:rgba(0,255,136,0.1);border:2px dashed rgba(0,255,136,0.4);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.photo-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.photo-hint{font-size:13px;color:rgba(255,255,255,0.45)}
.photo-hint span{display:block;font-size:11px;margin-top:2px;color:rgba(255,255,255,0.3)}
#photoInput{display:none}

/* TAGS INPUT */
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px 10px;min-height:44px;cursor:text}
.tags-wrap:focus-within{border-color:#00ff88}
.tag-item{background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.35);color:#00ff88;padding:3px 8px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:4px}
.tag-item button{background:none;border:none;color:#00ff88;cursor:pointer;padding:0;font-size:14px;line-height:1}
.tags-input{background:none;border:none;outline:none;color:#e2e8f0;font-size:14px;min-width:80px;flex:1}

/* SAVE BTN */
.btn-save{width:100%;padding:14px;background:#00ff88;color:#0a0e1a;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;-webkit-tap-highlight-color:transparent}
.btn-save:active{opacity:0.85}
.btn-save:disabled{opacity:0.5;cursor:default}

/* DETAIL VIEW */
.detail-photo{width:80px;height:80px;border-radius:50%;background:rgba(0,255,136,0.1);border:3px solid rgba(0,255,136,0.3);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#00ff88;margin:8px auto 0;background-size:cover;background-position:center;overflow:hidden}
.detail-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.detail-name{text-align:center;font-size:20px;font-weight:700;margin:10px 0 2px}
.detail-sub{text-align:center;color:rgba(255,255,255,0.45);font-size:14px;margin-bottom:16px}
.detail-actions{display:flex;gap:10px;padding:0 20px 16px}
.btn-action{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#e2e8f0;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-action:active{background:rgba(255,255,255,0.1)}
.btn-action.danger{border-color:rgba(255,60,60,0.4);color:#ff6b6b}
.detail-section{padding:0 20px;margin-bottom:16px}
.detail-section h3{font-size:11px;font-weight:600;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.detail-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.detail-icon{font-size:16px;width:24px;flex-shrink:0;margin-top:1px}
.detail-val{font-size:14px;color:#e2e8f0;word-break:break-word}
.detail-val a{color:#00ff88;text-decoration:none}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px}
.status-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600}
.status-badge.Identificado{background:rgba(0,255,136,0.15);color:#00ff88;border:1px solid rgba(0,255,136,0.3)}
.status-badge.Pendente{background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)}
.status-badge.Arquivado{background:rgba(100,116,139,0.15);color:#94a3b8;border:1px solid rgba(100,116,139,0.3)}

/* LOADING */
.loader{text-align:center;padding:40px;color:rgba(255,255,255,0.3)}
.spinner{width:32px;height:32px;border:3px solid rgba(0,255,136,0.2);border-top-color:#00ff88;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#e2e8f0;border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:10px 20px;font-size:14px;z-index:999;transition:transform .3s ease;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(0,255,136,0.5);color:#00ff88}
.toast.error{border-color:rgba(255,100,100,0.5);color:#ff6b6b}

/* SYNC BAR */
.syncbar{background:rgba(0,255,136,0.08);border-bottom:1px solid rgba(0,255,136,0.15);padding:6px 16px;font-size:12px;color:#00ff88;display:flex;align-items:center;gap:6px}
.syncbar.offline{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.2);color:#f59e0b}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* CONFIRM */
.confirm-box{background:#141824;border-radius:16px;margin:20px;padding:24px;text-align:center}
.confirm-box h3{margin-bottom:8px}
.confirm-box p{color:rgba(255,255,255,0.5);font-size:14px;margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn-cancel-c{background:rgba(255,255,255,0.08);color:#e2e8f0}
.btn-delete-c{background:#ff4444;color:#fff}
</style>
</head>
<body>

<div class="topbar">
  <h1>👤 FaceContext</h1>
  <span class="badge" id="countBadge">...</span>
  <button class="btn-fab" id="btnAdd" title="Novo contato">+</button>
</div>

<div id="syncBar" class="syncbar offline">
  <div class="sync-dot"></div>
  <span id="syncMsg">Conectando ao banco...</span>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" class="search-input" id="searchInput" placeholder="Buscar por nome, empresa, tag...">
</div>

<div class="tabs">
  <button class="tab active" data-filter="all">Todos</button>
  <button class="tab" data-filter="Identificado">✅ Identificados</button>
  <button class="tab" data-filter="Pendente">⏳ Pendentes</button>
  <button class="tab" data-filter="Arquivado">📁 Arquivados</button>
</div>

<div class="list" id="contactList">
  <div class="loader"><div class="spinner"></div>Carregando contatos...</div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Novo Contato</span>
      <button class="btn-close" id="btnCloseModal">✕</button>
    </div>
    <div class="form-body">

      <!-- FOTO -->
      <div class="photo-field">
        <div class="photo-preview" id="photoPreview" onclick="document.getElementById('photoInput').click()">
          📷
        </div>
        <div>
          <div class="photo-hint">Foto do contato</div>
          <div class="photo-hint"><span>Toca para selecionar da galeria</span></div>
        </div>
        <input type="file" id="photoInput" accept="image/*">
      </div>

      <div class="field">
        <label>Nome *</label>
        <input type="text" id="fName" placeholder="Nome completo" autocomplete="off">
      </div>
      <div class="field">
        <label>Apelido</label>
        <input type="text" id="fNickname" placeholder="Como chama no dia a dia">
      </div>
      <div class="row2">
        <div class="field">
          <label>Empresa</label>
          <input type="text" id="fCompany" placeholder="Empresa">
        </div>
        <div class="field">
          <label>Cargo</label>
          <input type="text" id="fRole" placeholder="Cargo">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Relação</label>
          <select id="fRelation">
            <option value="">Selecione</option>
            <option>Amigo</option>
            <option>Colega de trabalho</option>
            <option>Cliente</option>
            <option>Fornecedor</option>
            <option>Familiar</option>
            <option>Conhecido</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="fStatus">
            <option value="Identificado">✅ Identificado</option>
            <option value="Pendente">⏳ Pendente</option>
            <option value="Arquivado">📁 Arquivado</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Contexto da relação</label>
        <textarea id="fRelContext" placeholder="Onde se conheceram, como se relacionam..."></textarea>
      </div>

      <div class="field">
        <label>Tags</label>
        <div class="tags-wrap" id="tagsWrap" onclick="document.getElementById('tagInput').focus()">
          <input type="text" class="tags-input" id="tagInput" placeholder="Digite e pressione Enter...">
        </div>
      </div>

      <div class="field"><label>WhatsApp</label><input type="tel" id="fWhatsapp" placeholder="+55 11 99999-0000"></div>
      <div class="field"><label>Email</label><input type="email" id="fEmail" placeholder="email@exemplo.com"></div>
      <div class="field"><label>LinkedIn</label><input type="text" id="fLinkedin" placeholder="URL ou @usuario"></div>
      <div class="field"><label>Notas</label><textarea id="fNotes" placeholder="Informações extras, detalhes a lembrar..."></textarea></div>

      <button class="btn-save" id="btnSave">💾 Salvar Contato</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Perfil</span>
      <button class="btn-close" id="btnCloseDetail">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <div class="confirm-box">
      <h3>Excluir contato?</h3>
      <p id="confirmName">Esta ação não pode ser desfeita.</p>
      <div class="confirm-btns">
        <button class="btn-cancel-c" id="btnCancelDelete">Cancelar</button>
        <button class="btn-delete-c" id="btnConfirmDelete">Excluir</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROXY = "https://facecontext-10a8c066.base44.app/functions/fcProxy";
const UPLOAD_URL = "https://base44.app/api/apps/6a11083db49430b410a8c066/files/upload";

var allContacts = [];
var currentFilter = "all";
var searchQuery = "";
var editingId = null;
var currentTags = [];
var photoFile = null;
var photoDataUrl = null;
var pendingDeleteId = null;
var isOnline = false;

// ── TOAST ──────────────────────────────────────
function toast(msg, type) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast " + (type||"");
  el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 3000);
}

// ── SYNC BAR ───────────────────────────────────
function setSyncStatus(online, msg) {
  isOnline = online;
  var bar = document.getElementById("syncBar");
  var txt = document.getElementById("syncMsg");
  bar.className = "syncbar" + (online ? "" : " offline");
  txt.textContent = msg || (online ? "☁ Banco conectado" : "⚠ Sem conexão — modo local");
}

// ── API ────────────────────────────────────────
async function apiGet() {
  var r = await fetch(PROXY, { method: "GET" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function apiPost(data) {
  var r = await fetch(PROXY, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function apiDelete(id) {
  var r = await fetch(PROXY + "?id=" + id, { method: "DELETE" });
  return r.ok;
}

// ── LOAD ───────────────────────────────────────
async function loadContacts() {
  try {
    var data = await apiGet();
    allContacts = data;
    setSyncStatus(true, "☁ " + data.length + " contatos sincronizados");
    localStorage.setItem("fc_contacts", JSON.stringify(data));
  } catch(e) {
    var cached = localStorage.getItem("fc_contacts");
    if (cached) {
      allContacts = JSON.parse(cached);
      setSyncStatus(false, "⚠ Offline — " + allContacts.length + " contatos locais");
    } else {
      allContacts = [];
      setSyncStatus(false, "⚠ Sem conexão");
    }
  }
  renderList();
}

// ── RENDER LIST ────────────────────────────────
function renderList() {
  var q = searchQuery.toLowerCase();
  var filtered = allContacts.filter(function(c) {
    if (currentFilter !== "all" && c.status !== currentFilter) return false;
    if (!q) return true;
    return (c.name||"").toLowerCase().includes(q) ||
           (c.company||"").toLowerCase().includes(q) ||
           (c.nickname||"").toLowerCase().includes(q) ||
           (c.role||"").toLowerCase().includes(q) ||
           ((c.tags||[]).join(" ")).toLowerCase().includes(q);
  });

  document.getElementById("countBadge").textContent = filtered.length + "/" + allContacts.length;

  var html = "";
  if (filtered.length === 0) {
    html = '<div class="empty"><div class="icon">👥</div>' +
           (allContacts.length === 0 ? '<p>Nenhum contato ainda.<br>Toca no + para adicionar.</p>' :
            '<p>Nenhum contato encontrado.</p>') + '</div>';
  } else {
    filtered.forEach(function(c) {
      var initials = (c.name||"?").split(" ").map(function(w){return w[0]}).slice(0,2).join("").toUpperCase();
      var avatarStyle = c.photo_url ? 'background-image:url("'+c.photo_url+'");background-size:cover;background-position:center' : '';
      var avatarContent = c.photo_url ? '' : initials;
      var sub = [c.role, c.company].filter(Boolean).join(" · ") || c.relation || "";
      var tags = (c.tags||[]).slice(0,3).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("");
      html += '<div class="contact-card" onclick="openDetail(\''+c.id+'\')">'+
        '<div class="avatar" style="'+avatarStyle+'">'+avatarContent+'</div>'+
        '<div class="contact-info">'+
          '<div class="contact-name">'+esc(c.name||"Sem nome")+'</div>'+
          (sub ? '<div class="contact-sub">'+esc(sub)+'</div>' : '')+
          (tags ? '<div class="contact-tags">'+tags+'</div>' : '')+
        '</div>'+
        '<div class="status-dot '+esc(c.status||"Pendente")+'"></div>'+
      '</div>';
    });
  }
  document.getElementById("contactList").innerHTML = html;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── DETAIL ─────────────────────────────────────
function openDetail(id) {
  var c = allContacts.find(function(x){ return x.id === id; });
  if (!c) return;
  var initials = (c.name||"?").split(" ").map(function(w){return w[0]}).slice(0,2).join("").toUpperCase();

  var photoHtml = c.photo_url
    ? '<img src="'+esc(c.photo_url)+'" alt="">'
    : initials;

  var rows = "";
  if (c.relation) rows += detailRow("🤝", c.relation + (c.relation_context ? " · "+c.relation_context : ""));
  if (c.company||c.role) rows += detailRow("🏢", [c.role,c.company].filter(Boolean).join(" @ "));
  if (c.contact_whatsapp) rows += detailRow("📱", '<a href="https://wa.me/'+c.contact_whatsapp.replace(/\D/g,"")+'">'+esc(c.contact_whatsapp)+'</a>');
  if (c.contact_email) rows += detailRow("✉️", '<a href="mailto:'+esc(c.contact_email)+'">'+esc(c.contact_email)+'</a>');
  if (c.contact_linkedin) rows += detailRow("💼", '<a href="'+esc(c.contact_linkedin)+'" target="_blank">LinkedIn</a>');
  if (c.notes) rows += detailRow("📝", c.notes);

  var tagsHtml = (c.tags||[]).length > 0
    ? '<div class="detail-tags">'+(c.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>'
    : "";

  document.getElementById("detailContent").innerHTML =
    '<div class="detail-photo">'+photoHtml+'</div>'+
    '<div class="detail-name">'+esc(c.name||"Sem nome")+'</div>'+
    '<div class="detail-sub"><span class="status-badge '+esc(c.status||"Pendente")+'">'+esc(c.status||"Pendente")+'</span></div>'+
    (tagsHtml ? '<div style="text-align:center;padding:8px 0">'+tagsHtml+'</div>' : '')+
    '<div class="detail-actions">'+
      '<button class="btn-action" onclick="openEdit(\''+id+'\')">✏️ Editar</button>'+
      '<button class="btn-action danger" onclick="confirmDelete(\''+id+'\')">🗑 Excluir</button>'+
    '</div>'+
    (rows ? '<div class="detail-section"><h3>Informações</h3>'+rows+'</div>' : '');

  document.getElementById("detailOverlay").classList.add("open");
}

function detailRow(icon, val) {
  return '<div class="detail-row"><span class="detail-icon">'+icon+'</span><span class="detail-val">'+val+'</span></div>';
}

// ── EDIT ───────────────────────────────────────
function openEdit(id) {
  var c = allContacts.find(function(x){ return x.id === id; });
  if (!c) return;
  document.getElementById("detailOverlay").classList.remove("open");
  editingId = id;
  fillForm(c);
  document.getElementById("modalTitle").textContent = "Editar Contato";
  document.getElementById("modalOverlay").classList.add("open");
}

function fillForm(c) {
  document.getElementById("fName").value = c.name||"";
  document.getElementById("fNickname").value = c.nickname||"";
  document.getElementById("fCompany").value = c.company||"";
  document.getElementById("fRole").value = c.role||"";
  document.getElementById("fRelation").value = c.relation||"";
  document.getElementById("fStatus").value = c.status||"Identificado";
  document.getElementById("fRelContext").value = c.relation_context||"";
  document.getElementById("fWhatsapp").value = c.contact_whatsapp||"";
  document.getElementById("fEmail").value = c.contact_email||"";
  document.getElementById("fLinkedin").value = c.contact_linkedin||"";
  document.getElementById("fNotes").value = c.notes||"";

  currentTags = c.tags ? [...c.tags] : [];
  renderTags();

  photoFile = null;
  photoDataUrl = c.photo_url || null;
  var preview = document.getElementById("photoPreview");
  if (photoDataUrl) {
    preview.innerHTML = '<img src="'+esc(photoDataUrl)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  } else {
    preview.textContent = "📷";
  }
}

// ── ADD MODAL ──────────────────────────────────
function openAdd() {
  editingId = null;
  currentTags = [];
  photoFile = null;
  photoDataUrl = null;
  document.getElementById("fName").value="";
  document.getElementById("fNickname").value="";
  document.getElementById("fCompany").value="";
  document.getElementById("fRole").value="";
  document.getElementById("fRelation").value="";
  document.getElementById("fStatus").value="Identificado";
  document.getElementById("fRelContext").value="";
  document.getElementById("fWhatsapp").value="";
  document.getElementById("fEmail").value="";
  document.getElementById("fLinkedin").value="";
  document.getElementById("fNotes").value="";
  document.getElementById("photoPreview").textContent="📷";
  renderTags();
  document.getElementById("modalTitle").textContent="Novo Contato";
  document.getElementById("modalOverlay").classList.add("open");
  setTimeout(function(){ document.getElementById("fName").focus(); }, 350);
}

// ── TAGS ───────────────────────────────────────
function renderTags() {
  var wrap = document.getElementById("tagsWrap");
  var existingInput = document.getElementById("tagInput");
  wrap.innerHTML = "";
  currentTags.forEach(function(t, i) {
    var span = document.createElement("span");
    span.className = "tag-item";
    span.innerHTML = esc(t)+'<button onclick="removeTag('+i+')">×</button>';
    wrap.appendChild(span);
  });
  var inp = document.createElement("input");
  inp.type = "text";
  inp.className = "tags-input";
  inp.id = "tagInput";
  inp.placeholder = currentTags.length ? "" : "Digite e pressione Enter...";
  inp.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      var val = inp.value.trim().replace(/,/g,"");
      if (val && !currentTags.includes(val)) {
        currentTags.push(val);
        renderTags();
      } else { inp.value = ""; }
    } else if (e.key === "Backspace" && inp.value === "" && currentTags.length) {
      currentTags.pop();
      renderTags();
    }
  });
  wrap.appendChild(inp);
}
function removeTag(i) { currentTags.splice(i,1); renderTags(); }

// ── PHOTO ──────────────────────────────────────
document.getElementById("photoInput").addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  photoFile = file;
  var reader = new FileReader();
  reader.onload = function(ev) {
    photoDataUrl = ev.target.result;
    document.getElementById("photoPreview").innerHTML =
      '<img src="'+photoDataUrl+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  };
  reader.readAsDataURL(file);
});

// ── SAVE ───────────────────────────────────────
document.getElementById("btnSave").addEventListener("click", async function() {
  var name = document.getElementById("fName").value.trim();
  if (!name) { toast("Nome é obrigatório", "error"); document.getElementById("fName").focus(); return; }

  var btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.textContent = "Salvando...";

  try {
    var photoUrl = photoDataUrl;

    // Upload foto se for nova (data URL)
    if (photoFile && photoDataUrl && photoDataUrl.startsWith("data:")) {
      try {
        var blob = await fetch(photoDataUrl).then(function(r){return r.blob()});
        var fd = new FormData();
        fd.append("file", blob, photoFile.name);
        var up = await fetch(UPLOAD_URL, { method: "POST", body: fd });
        if (up.ok) {
          var upJson = await up.json();
          photoUrl = upJson.file_url || upJson.url || photoDataUrl;
        }
      } catch(e) { /* mantém data URL */ }
    }

    var payload = {
      name: name,
      nickname: document.getElementById("fNickname").value.trim()||null,
      company: document.getElementById("fCompany").value.trim()||null,
      role: document.getElementById("fRole").value.trim()||null,
      relation: document.getElementById("fRelation").value||null,
      relation_context: document.getElementById("fRelContext").value.trim()||null,
      status: document.getElementById("fStatus").value||"Identificado",
      tags: currentTags,
      contact_whatsapp: document.getElementById("fWhatsapp").value.trim()||null,
      contact_email: document.getElementById("fEmail").value.trim()||null,
      contact_linkedin: document.getElementById("fLinkedin").value.trim()||null,
      notes: document.getElementById("fNotes").value.trim()||null,
      photo_url: photoUrl||null,
    };

    if (editingId) {
      // PUT via proxy (update)
      var r = await fetch(PROXY + "?id=" + editingId, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error("Erro ao atualizar");
      var updated = await r.json();
      var idx = allContacts.findIndex(function(x){return x.id===editingId});
      if (idx >= 0) allContacts[idx] = updated;
      toast("Contato atualizado! ✅", "success");
    } else {
      var created = await apiPost(payload);
      allContacts.unshift(created);
      toast("Contato salvo! ✅", "success");
    }

    localStorage.setItem("fc_contacts", JSON.stringify(allContacts));
    document.getElementById("modalOverlay").classList.remove("open");
    renderList();
    setSyncStatus(true, "☁ " + allContacts.length + " contatos");

  } catch(err) {
    toast("Erro ao salvar: " + err.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "💾 Salvar Contato";
  }
});

// ── DELETE ─────────────────────────────────────
function confirmDelete(id) {
  var c = allContacts.find(function(x){ return x.id === id; });
  pendingDeleteId = id;
  document.getElementById("confirmName").textContent = c ? '"'+c.name+'"' : "Este contato";
  document.getElementById("detailOverlay").classList.remove("open");
  document.getElementById("confirmOverlay").classList.add("open");
}
document.getElementById("btnCancelDelete").addEventListener("click", function(){
  document.getElementById("confirmOverlay").classList.remove("open");
  pendingDeleteId = null;
});
document.getElementById("btnConfirmDelete").addEventListener("click", async function(){
  if (!pendingDeleteId) return;
  document.getElementById("confirmOverlay").classList.remove("open");
  try {
    await fetch(PROXY + "?id=" + pendingDeleteId, { method: "DELETE" });
    allContacts = allContacts.filter(function(x){ return x.id !== pendingDeleteId; });
    localStorage.setItem("fc_contacts", JSON.stringify(allContacts));
    renderList();
    toast("Contato excluído", "");
  } catch(e) { toast("Erro ao excluir", "error"); }
  pendingDeleteId = null;
});

// ── CLOSE MODALS ───────────────────────────────
document.getElementById("btnCloseModal").addEventListener("click", function(){ document.getElementById("modalOverlay").classList.remove("open"); });
document.getElementById("btnCloseDetail").addEventListener("click", function(){ document.getElementById("detailOverlay").classList.remove("open"); });
document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("open"); });
document.getElementById("detailOverlay").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("open"); });
document.getElementById("confirmOverlay").addEventListener("click", function(e){ if(e.target===this){ this.classList.remove("open"); pendingDeleteId=null; } });

// ── FILTER / SEARCH ────────────────────────────
document.querySelectorAll(".tab").forEach(function(tab){
  tab.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
    tab.classList.add("active");
    currentFilter = tab.dataset.filter;
    renderList();
  });
});
document.getElementById("searchInput").addEventListener("input", function(){
  searchQuery = this.value;
  renderList();
});

// ── FAB ────────────────────────────────────────
document.getElementById("btnAdd").addEventListener("click", openAdd);

// Para suportar PUT e DELETE, o proxy precisa aceitar esses métodos

// ── INIT ───────────────────────────────────────
loadContacts();

// Atualiza a cada 60s se online
setInterval(function(){
  if (isOnline) loadContacts();
}, 60000);
</script>
