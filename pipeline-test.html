<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
var results = [];
function out(msg, cls) {
  results.push('<div class="' + (cls||'dim') + '">' + msg + '</div>');
  document.getElementById('out').innerHTML = results.join('');
}
window.onerror = function(m, s, l) { out('RUNTIME ERROR: ' + m + ' (linha ' + l + ')', 'fail'); };
out('carregando face-api.js@0.22.2 + modelos (mesmos URLs do emulador)...');

Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model'),
  faceapi.nets.faceLandmark68TinyNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model'),
  faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model')
])
.then(function() { out('PASS modelos carregados do CDN (tiny detector + tiny landmarks + recognition)', 'pass'); return run(); })
.catch(function(e) { out('FAIL carregar modelos: ' + e.message, 'fail'); });

function detect(imgEl) {
  return faceapi.detectSingleFace(imgEl, new faceapi.TinyFaceDetectorOptions({scoreThreshold:0.4}))
    .withFaceLandmarks(true)   // mesmo fix do emulador
    .withFaceDescriptor();
}

function run() {
  var imgA1 = document.getElementById('imgA1');
  var imgA2 = document.getElementById('imgA2');
  var imgB  = document.getElementById('imgB');

  return Promise.all([detect(imgA1), detect(imgA2), detect(imgB)])
    .then(function(r) {
      var dA1 = r[0] && r[0].descriptor;
      var dA2 = r[1] && r[1].descriptor;
      var dB  = r[2] && r[2].descriptor;

      if (!dA1 || !dA2 || !dB) {
        out('FAIL deteccao nao encontrou rosto em uma das imagens: A1=' + !!dA1 + ' A2=' + !!dA2 + ' B=' + !!dB, 'fail');
        return;
      }
      out('PASS deteccao encontrou rosto nas 3 imagens (TinyFaceDetector scoreThreshold 0.4 + landmarks tiny)', 'pass');
      out('PASS descriptor e Float32Array(' + dA1.length + ')', dA1.length === 128 ? 'pass' : 'fail');

      // TESTE 1: round-trip de serializacao (o bug que corrompeu o cadastro do Marcus)
      var asArray = Array.from(dA1);
      var asJson = JSON.stringify(asArray);
      var parsed = JSON.parse(asJson);
      var roundTrip = new Float32Array(parsed);
      var distSelf = faceapi.euclideanDistance(dA1, roundTrip);
      out('TESTE 1 round-trip Array.from->JSON->parse->Float32Array: distancia com original = ' + distSelf, distSelf === 0 ? 'pass' : 'fail');

      // TESTE 2: formato corrompido antigo (Float32Array direto no JSON.stringify)
      var corruptedJson = JSON.stringify(dA1); // Float32Array cru -> vira objeto {"0":...}
      var corruptedParsed = JSON.parse(corruptedJson);
      var isCorruptedObject = !Array.isArray(corruptedParsed);
      out('TESTE 2 JSON.stringify(Float32Array cru) produz objeto (bug antigo): ' + (isCorruptedObject ? 'SIM, confirma causa raiz' : 'nao?!'), isCorruptedObject ? 'pass' : 'fail');

      // TESTE 3: validacao do loadEmbeddings novo rejeita embedding corrompido
      var acceptedByOldValidation = false;
      var acceptedByNewValidation = Array.isArray(corruptedParsed) && corruptedParsed.length === 128;
      out('TESTE 3 validacao nova (Array.isArray + length===128) rejeita o formato corrompido: ' + (!acceptedByNewValidation ? 'SIM' : 'NAO'), !acceptedByNewValidation ? 'pass' : 'fail');

      // TESTE 4: euclideanDistance com descriptor corrompido quebraria (comportamento do bug antigo)
      var corruptF32 = new Float32Array(corruptedParsed); // length 0
      var threwOld = false;
      try { faceapi.euclideanDistance(dA1, corruptF32); } catch(e) { threwOld = true; }
      out('TESTE 4 euclideanDistance com embedding corrompido lanca erro ("' + (threwOld ? 'length mismatch' : 'sem erro?!') + '") — era isso que travava o emulador', threwOld ? 'pass' : 'fail');

      // TESTE 5: distancias reais vs thresholds do emulador
      var distSame = faceapi.euclideanDistance(dA1, dA2);
      var distDiff = faceapi.euclideanDistance(dA1, dB);
      out('TESTE 5 mesma pessoa (2 fotos): distancia = ' + distSame.toFixed(3) + (distSame < 0.5 ? ' → PASS match confidente (<0.5)' : distSame < 0.62 ? ' → WARN cai em candidatos (<0.62)' : ' → FAIL deveria ser menor'), distSame < 0.5 ? 'pass' : 'warn');
      out('TESTE 6 pessoas diferentes: distancia = ' + distDiff.toFixed(3) + (distDiff >= 0.62 ? ' → PASS nao reconhecido (>=0.62)' : ' → WARN baixo demais'), distDiff >= 0.62 ? 'pass' : 'warn');

      out('--- FIM: todos os testes concluidos ---', 'pass');
    })
    .catch(function(e) { out('FAIL no pipeline: ' + (e && e.message ? e.message : e), 'fail'); });
}
</script>
