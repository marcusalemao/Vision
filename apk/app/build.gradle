plugins {
    id 'com.android.application'
}

android {
    namespace         'com.facecontext'
    compileSdk        34

    defaultConfig {
        applicationId   "com.facecontext"
        minSdk          28          // CXR-S SDK requer minSdk >= 28
        targetSdk       34
        versionCode     1
        versionName     "0.1-alpha"
    }

    buildTypes {
        release {
            minifyEnabled   false
            // TODO: habilitar ProGuard quando APK estiver estável
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Fixes para libs nativas do CXR-S SDK
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ── Rokid CXR-S SDK ──────────────────────────────────────────
    // On-device SDK — roda diretamente nos óculos
    // Fonte: https://maven.rokid.com/repository/maven-public/
    // Docs:  https://github.com/buildwithfenna/rokid-docs/tree/main/cxr-s
    implementation 'com.rokid.cxr:cxr-service-bridge:1.0-20250519.061355-45'

    // ── HTTP — envio de JPEG para API de reconhecimento ──────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ── Fases futuras (comentadas até estabilizar) ────────────────

    // Room — banco local de perfis (Fase 2: cache offline)
    // implementation "androidx.room:room-runtime:2.6.1"
    // annotationProcessor "androidx.room:room-compiler:2.6.1"

    // TensorFlow Lite — reconhecimento facial offline (Fase 3)
    // implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    // implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // ML Kit — detecção de rostos fallback (Fase 3)
    // implementation 'com.google.mlkit:face-detection:16.1.5'
}
